name: Build & Release Firmware

# push 到主分支即自动构建 zhengchen-eye S3 主固件与 C5 WiFi Bridge 固件 (ESP-IDF v5.5.2),
# 版本号从 zhengchen-eye/CMakeLists.txt 的 PROJECT_VER 读取, 自动创建 tag 并发布到 Release,
# 无需手动打 tag。
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
      changed: ${{ steps.get.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read PROJECT_VER and check tag
        id: get
        shell: bash
        run: |
          # 版本号取自 zhengchen-eye 项目 (即本次打包的主项目)
          VER=$(grep -oP 'set\(PROJECT_VER\s+"\K[^"]+' zhengchen-eye/CMakeLists.txt)
          if [ -z "$VER" ]; then
            echo "无法从 zhengchen-eye/CMakeLists.txt 读取 PROJECT_VER"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Project version: v$VER"
          # 若 tag v$VER 已存在, 说明版本未变化, 跳过构建与发布
          if git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "tag v$VER 已存在, 版本未变化, 跳过构建。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到新版本 v$VER, 将构建并发布。"
          fi

  build:
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- zhengchen-eye S3 主固件 (魔眼, 支持 WiFi/4G/C5) ----
          - name: zhengchen_eye
            kind: s3
            board: zhengchen_eye
            board_config: CONFIG_BOARD_TYPE_ZHENGCHEN_EYE
          # ---- C5 WiFi Bridge 固件 ----
          - name: c5-wifi-bridge
            kind: c5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build S3 firmware (zhengchen-eye)
        if: matrix.kind == 's3'
        shell: bash
        working-directory: zhengchen-eye
        run: |
          . "$IDF_PATH/export.sh"
          # 与 scripts/release.py 一致: 先 set-target 生成 sdkconfig,
          # 再按 config.json 追加板级配置 (含 USE_4G_WIFI, 使 C5 网桥路径可用)。
          idf.py set-target esp32s3
          {
            echo ""
            echo "${{ matrix.board_config }}=y"
            echo "CONFIG_USE_DEVICE_AEC=y"
            echo "CONFIG_USE_4G_WIFI=y"
          } >> sdkconfig
          idf.py -DBOARD_NAME="${{ matrix.board }}" build
          idf.py -DBOARD_NAME="${{ matrix.board }}" merge-bin

      - name: Build C5 firmware
        if: matrix.kind == 'c5'
        shell: bash
        working-directory: c5_wifi_bridge
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32c5
          idf.py build
          idf.py merge-bin

      - name: Collect S3 artifact
        if: matrix.kind == 's3'
        shell: bash
        run: |
          mkdir -p dist
          cp zhengchen-eye/build/merged-binary.bin "dist/v${{ needs.version.outputs.version }}_${{ matrix.name }}.bin"

      - name: Collect C5 artifact
        if: matrix.kind == 'c5'
        shell: bash
        run: |
          mkdir -p dist
          cp c5_wifi_bridge/build/merged-binary.bin "dist/v${{ needs.version.outputs.version }}_${{ matrix.name }}.bin"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.name }}
          path: dist/*.bin
          if-no-files-found: error

  flasher:
    # 依赖 build: 需要把两个固件一起打进 exe, 烧录工具运行时无需联网下载
    needs: [version, build]
    if: needs.version.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/flasher/requirements.txt pyinstaller

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: scripts/flasher/firmware
          merge-multiple: true

      - name: Verify bundled firmwares
        shell: bash
        run: |
          VER="${{ needs.version.outputs.version }}"
          ls -l scripts/flasher/firmware
          for f in "v${VER}_zhengchen_eye.bin" "v${VER}_c5-wifi-bridge.bin"; do
            if [ ! -f "scripts/flasher/firmware/$f" ]; then
              echo "缺少内置固件: $f"
              exit 1
            fi
          done

      - name: Build flasher exe
        shell: bash
        run: |
          # 将版本号固化进脚本目录, flash_gui.py 会 import _version.APP_VERSION
          echo "APP_VERSION = \"${{ needs.version.outputs.version }}\"" > scripts/flasher/_version.py
          # esptool 在进程内调用, 需连同其数据文件和动态子模块一起打包 (--collect-all)
          # --add-data 把本版本的 S3 / C5 固件打进 exe (运行时解压到 _MEIPASS/firmware)
          pyinstaller --noconsole --onefile \
            --name "RoPet-Flasher-v${{ needs.version.outputs.version }}" \
            --paths scripts/flasher \
            --hidden-import _version \
            --collect-all esptool \
            --add-data "scripts/flasher/firmware;firmware" \
            scripts/flasher/flash_gui.py

      - name: Upload flasher artifact
        uses: actions/upload-artifact@v4
        with:
          name: flasher-windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: [version, build, flasher]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          files: |
            artifacts/*.bin
            artifacts/*.exe
          generate_release_notes: true
